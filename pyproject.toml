[project]
name = "sih26145"
version = "0.1.0"
description = "Passive streaming cyber-threat detection prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "numpy>=1.24.1,<2.5",
    "pydantic>=2,<3",
    "scikit-learn==1.9.0",
    "uvicorn==0.35.0",
]

[project.scripts]
sih26145-replay = "sih26145.cli:main"
sih26145-dashboard = "sih26145.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15",
    "pytest>=8,<9",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: exercises process or native Zeek boundaries",
    "e2e: exercises the complete native Zeek replay path",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]

[tool.hatch.build.targets.wheel]
packages = ["src/sih26145"]

[tool.hatch.build.targets.wheel.force-include]
"src/sih26145/py.typed" = "sih26145/py.typed"

[tool.setuptools.package-data]
"sih26145" = ["py.typed"]
